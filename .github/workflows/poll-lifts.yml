name: Poll TfL lift disruptions

# Every five minutes. GitHub may delay or drop scheduled runs under load, which
# is exactly why the app shows feed freshness rather than assuming it is current
# — and why workflow_dispatch is enabled for a manual catch-up.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: poll-tfl-lifts
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger collector
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and CRON_SECRET repository secrets must both be set." >&2
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 2 \
            --max-time 60 \
            -X POST "${APP_URL}/api/internal/poll-lifts" \
            -H "Authorization: Bearer ${CRON_SECRET}"
